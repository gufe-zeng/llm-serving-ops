name: Reconstruct binary assets

on:
  push:
    branches:
      - main
    paths:
      - ".asset_chunks/**"
      - ".github/workflows/reconstruct-assets.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct binary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/diagrams

          cat .asset_chunks/manual_part_*.txt | tr -d '\r\n ' | base64 -d > "LLM-Serving-Ops-学习手册.docx"
          cat .asset_chunks/diag01_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/01_model_serving.png
          cat .asset_chunks/diag02_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/02_observability.png
          cat .asset_chunks/diag03_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/03_loadtest.png
          cat .asset_chunks/diag04_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/04_fastapi.png
          cat .asset_chunks/diag05_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/05_nginx.png
          cat .asset_chunks/diag06_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/06_final_architecture.png
          cat .asset_chunks/diag07_part_*.txt | tr -d '\r\n ' | base64 -d > docs/diagrams/07_troubleshooting_layers.png

      - name: Verify exact binary hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/checksums.txt <<'EOF'
          6f0e5d17b675182ceb153d25ba88f3fc4aa23f511ab4f196e3b11f57b608986e  LLM-Serving-Ops-学习手册.docx
          c8179668867e06bed67c18c3b897343e591641abaa14f1e22a79d9848817a107  docs/diagrams/01_model_serving.png
          269ddff524c712ec0df1b4dcc07efbb449fdc1e331ca86465f5782a0ceb83d3e  docs/diagrams/02_observability.png
          e2673a045734429627ede68d1ec47d52d17a79ad6732e9489e9c969f301899bf  docs/diagrams/03_loadtest.png
          c61bf625b0dbdd3cd36738da2e666437e2c5518c3c5fe324daedbaca83cc9271  docs/diagrams/04_fastapi.png
          4bfb3547faf357c0e25932c4849df96df85240997f85ccafd8d3a66b0ee629a9  docs/diagrams/05_nginx.png
          fdf2fd5fa0212e967207505aa4a7d53f45f28e67048a29eb872c63f8aa9bbfb7  docs/diagrams/06_final_architecture.png
          343cb20cb7d070ed59ee756e8584581dae8ac79930566c7c1e5b01d0acf9a69d  docs/diagrams/07_troubleshooting_layers.png
          EOF
          sha256sum -c /tmp/checksums.txt

      - name: Commit reconstructed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "LLM-Serving-Ops-学习手册.docx" docs/diagrams/*.png
          git rm -r .asset_chunks
          git commit -m "Add binary project assets [skip ci]"
          git push
